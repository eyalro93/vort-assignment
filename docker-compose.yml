services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vort
      POSTGRES_PASSWORD: vort
      POSTGRES_DB: vort
    ports:
      - "5432:5432"
    volumes:
      - vort_pgdata:/var/lib/postgresql/data
    # Lets `docker compose up --wait` (npm run db:up) block until Postgres
    # actually accepts connections, so db:migrate can run straight after.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vort -d vort"]
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  vort_pgdata:
